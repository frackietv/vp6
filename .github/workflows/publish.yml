# Publishing VP6 on PyPI: push a tag v<version> (e.g. v0.4.0) whose version is
# the one in pyproject.toml. It builds the wheel and the source distribution,
# checks them, and uploads them with PyPI's trusted publishing (no password
# or token in the repository). Set it up once on pypi.org: see "Releasing" in
# docs/development-guide.md.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"The tag {tag} isn't v{version}, pyproject.toml's version")
          PY
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # (on pypi.org, the trusted publisher names this environment)
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
