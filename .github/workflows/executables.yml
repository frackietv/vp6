# Standalone executables on the three systems VP6 supports: PyInstaller makes
# executables only for the system it runs on, so each is made (and run) there.
# The made Calculator sample of each system is kept as a downloadable artifact.
name: Standalone executables

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # no screen on the runners
      VP6_NO_ERROR_DIALOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install VP6 with what vp6-make needs
        run: pip install -e ".[dev,make]"
      - name: Make an executable and run it
        env:
          VP6_TEST_MAKE: "1"
        run: python -m pytest -q tests/test_make.py
      - name: Make the Calculator sample
        run: vp6-make samples/Calculator/Calculator.vp6p
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-${{ runner.os }}
          path: samples/Calculator/dist
